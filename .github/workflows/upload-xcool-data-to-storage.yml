name: Upload /public/xcool-data → Firebase Storage

on:
  push:
    paths:
      - "public/xcool-data/**"
  workflow_dispatch: {}

jobs:
  upload_to_storage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # for Workload Identity Federation
      contents: read

    env:
      # Change if your bucket differs
      GCS_BUCKET: "riasissu-7c453.firebasestorage.app"
      # Where in the bucket you want the files to live (keeps your new naming)
      GCS_PREFIX: "xcool-data"
      # Cache policy for clients; tweak to taste
      XCACHE: "max-age=30,public,stale-while-revalidate=120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Auth to Google Cloud (pick ONE) ----
      - name: Auth to Google Cloud (WIF - recommended)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # If you prefer a key file instead, comment WIF and uncomment this:
      # - name: Auth to Google Cloud (SA key)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud (includes gsutil)
        uses: google-github-actions/setup-gcloud@v2

      - name: Show gsutil version
        run: gsutil version -l

      # Mirror repo → bucket (preserves subfolders; deletes removed files)
      - name: Rsync to bucket
        run: |
          gsutil -m rsync -r -d ./public/xcool-data "gs://${GCS_BUCKET}/${GCS_PREFIX}"

      # Set headers on JSON (rsync doesn’t set metadata)
      - name: Set Cache-Control and Content-Type
        run: |
          gsutil -m setmeta \
            -h "Cache-Control:${XCACHE}" \
            -h "Content-Type:application/json; charset=utf-8" \
            "gs://${GCS_BUCKET}/${GCS_PREFIX}/**/*.json" || true

      # OPTIONAL: Only if you rely on object ACLs for public-read.
      # Prefer Firebase Storage Rules instead.
      # - name: Make objects public (optional)
      #   run: |
      #     gsutil -m acl ch -u AllUsers:R "gs://${GCS_BUCKET}/${GCS_PREFIX}/**"
